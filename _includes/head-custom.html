<style>

/* Colorful portfolio: responsive, accessible, and independent of theme sizing. */
* { box-sizing: border-box; }
html { scroll-padding-top: 24px; }
body {
  padding: 40px 24px;
  background: radial-gradient(ellipse at top left, #dbeafe 0, transparent 48%),
              radial-gradient(ellipse at top right, #dbeafe 0, transparent 42%), #f3f6fc;
  color: #334155; font-size: 16px; line-height: 1.75;
}
div.wrapper {
  width: 1120px; max-width: 100%; margin: 0 auto;
  display: grid; grid-template-columns: 290px minmax(0, 1fr);
  gap: 28px; align-items: start;
}
header {
  width: auto; float: none; position: sticky; top: 24px;
  padding: 30px 26px; margin: 0; border-radius: 24px;
  background: linear-gradient(145deg, #163b78, #1e40af);
  color: #e1efff; box-shadow: 0 16px 38px #173e7820;
}
header h1 { font-size: 28px; line-height: 1.25; letter-spacing: -.6px; }
header h1 a, header h1 a:hover { color: #fff; }
header img {
  display: block; width: 170px; max-width: 100%; height: 170px;
  object-fit: cover; border-radius: 50%; border: 5px solid #bfdbfe;
  margin: 24px 0; box-shadow: 0 0 0 7px #ffffff12;
}
header p { color: #e1efff; }
.portfolio-nav { gap: 10px; }
.portfolio-nav a {
  color: #fff; background: #ffffff12; border: 1px solid #ffffff55;
  border-radius: 9px; padding: 7px 12px; font-size: 13px;
}
.portfolio-nav a:hover { background: #fff; color: #1e40af; }
main {
  width: auto; min-width: 0; float: none; margin: 0; padding: 36px 40px;
  background: #fff; border: 1px solid #dbe5f0; border-top: 6px solid #2563eb;
  border-radius: 24px; box-shadow: 0 12px 40px #173e780c;
}
main h1 { font-size: clamp(30px, 4vw, 42px); line-height: 1.15; color: #163b78; letter-spacing: -1px; }
main h1 + p { color: #1d4ed8; }
main h1 + p strong { color: #1d4ed8; }
main h2 {
  margin: 36px 0 20px; padding: 12px 16px; border: 0;
  border-left: 4px solid #2563eb; border-radius: 0 10px 10px 0;
  background: #eff6ff; color: #1e40af; font-size: 21px; line-height: 1.4;
}
main h2:nth-of-type(2n) { background: #eff6ff; border-color: #2563eb; color: #1e40af; }
main h2:nth-of-type(3n) { background: #eff6ff; border-color: #2563eb; color: #1e40af; }
main h3 { color: #1e40af; font-size: 18px; margin-top: 26px; line-height: 1.45; }
main a { color: #1d4ed8; text-decoration: underline; text-underline-offset: 3px; }
a:hover, a:focus { font-weight: inherit; }
.portfolio-nav a:hover, .portfolio-nav a:focus { font-weight: 600; }
main a:hover { color: #1d4ed8; }
main li::marker { color: #2563eb; }
main li { padding-left: 3px; }
main strong { color: #1e3a5f; }
table { table-layout: fixed; border: 1px solid #dbe5f0; font-size: 14px; }
th { background: #163b78; color: #fff; }
th:first-child { width: 30%; }
td, th { padding: 11px 13px; border-bottom: 1px solid #dbe5f0; }
tbody tr:nth-child(even) { background: #eff6ff; }
tbody tr:nth-child(odd) { background: #f8faff; }
footer {
  grid-column: 1 / -1; width: auto; float: none; position: static;
  padding: 0; text-align: center; color: #52627a;
}
footer small { font-size: 12px; }
a:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 4px; }
header a:focus-visible { outline-color: #bfdbfe; }
@media screen and (max-width: 960px) {
  div.wrapper { grid-template-columns: 1fr; width: 760px; max-width: 100%; margin: 0 auto; }
  header { position: static; padding: 28px; margin: 0; }
  header img { width: 130px; height: 130px; }
  main { padding: 28px; margin: 0; }
}
@media screen and (max-width: 480px) {
  body { padding: 16px 12px; }
  div.wrapper { gap: 18px; }
  header, main { padding: 22px 18px; border-radius: 18px; }
  main h2 { font-size: 19px; }
  td, th { padding: 9px 8px; font-size: 13px; }
}
@media print {
  body { padding: 0; background: #fff; color: #222; }
  div.wrapper { display: block; width: auto; }
  header, main { position: static; background: #fff; color: #222; box-shadow: none; border: 0; }
  header h1 a, header p, .portfolio-nav a { color: #222; }
  header img { width: 100px; height: 100px; }
  main h2 { break-after: avoid; }
}
</style>

<style>
/* Version 03: sidebar with an editorial introduction and a card-based main area. */
@media screen {
  div.wrapper { width: 1320px; grid-template-columns: 290px minmax(0,1fr); gap: 32px; }
  main { background: transparent; border: 0; box-shadow: none; padding: 0; border-radius: 0; }
  .portfolio-intro {
    background: #102d4d; color: #e2edf8; padding: 36px;
    border-radius: 22px; border-bottom: 6px solid #3b82f6; margin-bottom: 26px;
  }
  .portfolio-intro h1 { color: #fff; font-size: clamp(32px,4vw,48px); }
  .portfolio-intro h1 + p strong { color: #bfdbfe; }
  .portfolio-intro a { color: #bfdbfe; }
  .portfolio-intro p:last-child { margin-bottom: 0; }
  .portfolio-section { background: #fff; border: 1px solid #dbe5f0; border-radius: 20px; padding: 28px; margin-bottom: 26px; }
  main .portfolio-section > h2 {
    margin: 0 0 24px; background: transparent; border: 0;
    border-bottom: 2px solid #dbeafe; border-radius: 0; padding: 0 0 15px;
    color: #163b78; font-size: 23px;
  }
  .portfolio-section > p:last-child { margin-bottom: 0; }
  .portfolio-card-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; }
  .portfolio-card { min-width: 0; background: #eff6ff; padding: 22px; border: 1px solid #bfdbfe; border-top: 4px solid #2563eb; border-radius: 13px; }
  .portfolio-card:nth-child(2n) { background: #eff6ff; border-color: #bfdbfe; border-top-color: #3b82f6; }
  .portfolio-card:nth-child(3n) { background: #eff6ff; border-color: #bfdbfe; border-top-color: #2563eb; }
  main .portfolio-card h3 { margin: 0 0 16px; font-size: 18px; color: #173c59; }
  .portfolio-card ul { padding-left: 18px; font-size: 14px; line-height: 1.7; }
  .portfolio-card p { font-size: 14px; }
  .portfolio-card > :last-child { margin-bottom: 0; }
  .portfolio-card-grid .portfolio-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .portfolio-section table { margin-bottom: 0; }
  #portfolio-contact { background: #eff6ff; border-color: #bfdbfe; }
}
@media screen and (max-width: 1100px) {
  .portfolio-card-grid { grid-template-columns: 1fr; }
}
@media screen and (max-width: 960px) {
  div.wrapper { width: 760px; grid-template-columns: 1fr; }
  main { padding: 0; }
}
@media screen and (max-width: 480px) {
  .portfolio-intro, .portfolio-section { padding: 22px 18px; }
  .portfolio-card { padding: 18px; }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var main = document.getElementById('main-content');
  if (!main || main.querySelector('.portfolio-intro')) return;
  var nodes = Array.from(main.childNodes);
  var intro = document.createElement('div');
  intro.className = 'portfolio-intro';
  var fragment = document.createDocumentFragment();
  fragment.appendChild(intro);
  var current = intro;
  nodes.forEach(function (node) {
    if (node.nodeType === 1 && node.tagName === 'H2') {
      current = document.createElement('section');
      current.className = 'portfolio-section';
      if (node.id) {
        current.setAttribute('aria-labelledby', node.id);
        current.id = 'portfolio-' + node.id;
      }
      fragment.appendChild(current);
    }
    current.appendChild(node);
  });
  main.appendChild(fragment);
  main.querySelectorAll('.portfolio-section').forEach(function (section) {
    if (!section.querySelector('h3')) return;
    var grid = document.createElement('div');
    grid.className = 'portfolio-card-grid';
    var card = null;
    Array.from(section.childNodes).forEach(function (node) {
      if (node.nodeType === 1 && node.tagName === 'H3') {
        card = document.createElement('article');
        card.className = 'portfolio-card';
        if (node.id) card.setAttribute('aria-labelledby', node.id);
        grid.appendChild(card);
      }
      if (card) card.appendChild(node);
    });
    section.appendChild(grid);
  });
});
</script>

<style>
/* Muted navy sidebar. */
@media screen {
  header { background: #102d4d; border: 1px solid #243247; box-shadow: 0 12px 30px #0b142620; }
  header p { color: #c6d1df; }
  header img { border-color: #72849b; box-shadow: 0 0 0 7px #ffffff04; }
  .portfolio-nav a { background: #1a2a40; border-color: #3a4c64; color: #e3eaf3; }
  .portfolio-nav a:hover { background: #283b54; border-color: #647a96; color: #ffffff; }
  header a:focus-visible { outline-color: #c5dbed; }
}
</style>
