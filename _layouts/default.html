<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>

        {% if site.logo %}
          <img src="{{site.logo | relative_url}}" alt="Prakash Bhavani Selvaraj" />
        {% endif %}

        <p>{{ site.description | default: site.github.project_tagline }}</p>

        <nav class="portfolio-nav" aria-label="Portfolio navigation">
          <a href="{{ '/' | relative_url }}#data-engineering-experience">Experience</a>
          <a href="{{ '/' | relative_url }}#independent-machine-learning-projects">Projects</a>
          <a href="https://github.com/bsprakashbs">GitHub</a>
          <a href="https://www.linkedin.com/in/prakash-bhavani-selvaraj-523a8a188/">LinkedIn</a>
          <a href="{{ '/' | relative_url }}#contact">Contact</a>
        </nav>
      </header>
      <main id="main-content">

      {{ content }}

      </main>
      <footer>
        <p><small>Hosted on GitHub Pages &mdash; Theme by <a href="https://github.com/orderedlist">orderedlist</a></small></p>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
